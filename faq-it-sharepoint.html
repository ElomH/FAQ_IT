  .back-btn:hover { background: #005073; color: #fff; }

  .search-meta { font-size: 14px; color: #666; margin-bottom: 14px; }

  .faq-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 36px; }
  .faq-item { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.07); border-left: 4px solid #e0e6ec; overflow: hidden; transition: border-left-color .2s; }
  .faq-item.open { border-left-color: #E36F1E; }
  .faq-header { width: 100%; background: none; border: none; padding: 15px 16px; display: flex; align-items: center; gap: 11px; cursor: pointer; text-align: left; font-family: inherit; transition: background .12s; }
  .faq-header:hover { background: rgba(0,0,0,0.025); }

  .faq-site { font-size: 12px; color: #666; white-space: nowrap; }
  .faq-chevron { font-size: 10px; color: #005073; flex-shrink: 0; }
  .faq-body { padding: 4px 18px 18px; border-top: 1px solid #f0f3f6; }
  .faq-resume { font-size: 14px; color: #666; font-style: italic; margin: 11px 0 16px; line-height: 1.6; }
  .solution-title { font-size: 14px; font-weight: 600; color: #005073; margin-bottom: 10px; }
  .solution-steps { margin: 0 0 16px; padding-left: 20px; }
  .solution-steps li { font-size: 14px; color: #333; margin-bottom: 7px; line-height: 1.6; }
  .contact-bar { background: #eef3f7; border-radius: 6px; padding: 11px 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 13px; font-size: 13px; margin-bottom: 10px; }

  .contact-link { color: #005073; text-decoration: none; font-weight: 500; }
  .contact-link:hover { color: #E36F1E; text-decoration: underline; }
  .faq-footer { font-size: 11px; color: #9aa5b1; }

  .no-results { text-align: center; padding: 44px 20px; color: #666; font-size: 15px; }
  .no-results p { margin-bottom: 8px; }

  .help-btn-primary { background: #E36F1E; border-color: #E36F1E; }

  /* LOADING / ERROR */
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 20px; color: #666; gap: 14px; font-size: 15px; }
  .spinner { width: 34px; height: 34px; border: 3px solid #e0e6ec; border-top-color: #E36F1E; border-radius: 50%; animation: spin .75s linear infinite; }

function loadItems() {
  allItems = EMBEDDED_DATA;
  hide(loadingBox);
  renderHelpSection();
  showHome();
}

// ── Rendu section aide ────────────────────────────────────────────────────────
function renderHelpSection() {
  helpActions.innerHTML = '';
  var actions = [
    { href: 'mailto:' + CONFIG.contactEmail, label: '📧 Envoyer un email', primary: false }
  ];
  if (CONFIG.teamsUrl)    actions.push({ href: CONFIG.teamsUrl,    label: '💬 Canal Teams IT',      primary: false, blank: true });
  if (CONFIG.helpdeskUrl) actions.push({ href: CONFIG.helpdeskUrl, label: '📝 Soumettre un ticket', primary: true,  blank: true });

  actions.forEach(function(a) {
    var el = document.createElement('a');
    el.href = a.href;
    el.textContent = a.label;
    el.className = 'help-btn';
    if (a.blank) { el.target = '_blank'; el.rel = 'noreferrer noopener'; }
    helpActions.appendChild(el);
  });
  helpSection.style.display = 'block';
}

// ── Vue accueil ───────────────────────────────────────────────────────────────
function showHome() {
  currentCategory = null;
  expandedId = null;
  searchInput.value = '';
  hide(clearBtn); hide(searchMeta); hide(faqList); hide(catHeader);

  // Tabs
  buildTabs();
  show(catNav);
  setActiveTab('');

  // Grille
  catGrid.innerHTML = '';
  CATEGORIES.forEach(function(cat) {
    var count = allItems.filter(function(i) { return i.field_1 === cat.key; }).length;
    var card = document.createElement('button');
    card.className = 'cat-card';
    card.setAttribute('aria-label', 'Ouvrir la catégorie ' + cat.label);
    card.innerHTML =
      '<span class="cat-icon">' + cat.icon + '</span>' +
      '<strong class="cat-title">' + esc(cat.label) + '</strong>' +
      '<span class="cat-desc">' + esc(cat.desc) + '</span>' +
      '<span class="cat-count">' + count + ' fiche' + (count !== 1 ? 's' : '') + '</span>';
    card.addEventListener('click', function() { showCategory(cat.key); });
    catGrid.appendChild(card);
  });
  show(catGrid);
}

// ── Vue catégorie ─────────────────────────────────────────────────────────────
function showCategory(key) {
  currentCategory = key;
  expandedId = null;
  searchInput.value = '';
  hide(clearBtn); hide(catGrid); hide(searchMeta);
  setActiveTab(key);

  var cat = CATEGORIES.find(function(c) { return c.key === key; });
  if (cat) {
    catHeaderIcon.textContent = cat.icon;
    catHeaderTitle.textContent = cat.label;
    show(catHeader);
  }

  var filtered = allItems.filter(function(i) { return i.field_1 === key; });
  renderFaqList(filtered);
}

// ── Recherche ─────────────────────────────────────────────────────────────────
function handleSearch(q) {
  if (!q) { showHome(); return; }
  currentCategory = null;
  expandedId = null;
  hide(catGrid); hide(catHeader);
  setActiveTab('');

  var ql = q.toLowerCase();
  var filtered = allItems.filter(function(i) {
    return i.Title.toLowerCase().includes(ql) ||
      (i.field_3 || '').toLowerCase().includes(ql) ||
      (i.field_4 || '').toLowerCase().includes(ql) ||
      (i.field_1 || '').toLowerCase().includes(ql);
  });

  searchMeta.textContent = filtered.length + ' résultat' + (filtered.length !== 1 ? 's' : '') +
    ' pour « ' + q + ' »';
  show(searchMeta);
  renderFaqList(filtered);
}

// ── Rendu liste FAQ ───────────────────────────────────────────────────────────
function renderFaqList(items) {
  faqList.innerHTML = '';

  if (items.length === 0) {
    faqList.innerHTML = '<div class="no-results"><p>Aucune fiche trouvée.</p>' +
      '<p>Contactez l\'IT : <a class="contact-link" href="mailto:' + esc(CONFIG.contactEmail) + '">' + esc(CONFIG.contactEmail) + '</a></p></div>';
    show(faqList);
    return;
  }

  items.forEach(function(item) {
    var article = document.createElement('article');
    article.className = 'faq-item';
    article.setAttribute('role', 'listitem');
    article.dataset.id = item.Id;

    var color = NIVEAU_COLORS[item.field_2] || '#546e7a';
    var steps = parseSolution(item.field_4 || '');

    // Header
    var hdr = document.createElement('button');
    hdr.className = 'faq-header';
    hdr.setAttribute('aria-expanded', 'false');
    hdr.innerHTML =
      '<span class="badge" style="background:' + color + '">' + esc(item.field_2) + '</span>' +
      '<span class="faq-question">' + esc(item.Title) + '</span>' +
      '<span class="faq-site">' + esc(item.field_6 || '') + '</span>' +
      '<span class="faq-chevron">▼</span>';
    hdr.addEventListener('click', function() { toggleItem(item, article, hdr, steps); });

    article.appendChild(hdr);
    faqList.appendChild(article);
  });

  show(faqList);
}

// ── Accordéon ─────────────────────────────────────────────────────────────────
function toggleItem(item, article, hdr, steps) {
  var wasOpen = article.classList.contains('open');

  // Fermer tous
  document.querySelectorAll('.faq-item.open').forEach(function(el) {
    el.classList.remove('open');
    var b = el.querySelector('.faq-header');
    b.setAttribute('aria-expanded', 'false');
    b.querySelector('.faq-chevron').textContent = '▼';
    var body = el.querySelector('.faq-body');
    if (body) body.remove();
  });

  if (wasOpen) return;

  // Ouvrir
  article.classList.add('open');
  hdr.setAttribute('aria-expanded', 'true');
  hdr.querySelector('.faq-chevron').textContent = '▲';

  var body = document.createElement('div');
  body.className = 'faq-body';

  var resumeHtml = item.field_3 ? '<p class="faq-resume">' + esc(item.field_3) + '</p>' : '';
  var stepsHtml = steps.map(function(s) { return '<li>' + esc(s) + '</li>'; }).join('');

  var contactLinks = '<a class="contact-link" href="mailto:' + esc(item.ContactIT || CONFIG.contactEmail) + '">📧 ' + esc(item.ContactIT || CONFIG.contactEmail) + '</a>';
  if (CONFIG.teamsUrl) contactLinks += ' <a class="contact-link" href="' + esc(CONFIG.teamsUrl) + '" target="_blank" rel="noreferrer noopener">💬 Teams IT</a>';
  if (CONFIG.helpdeskUrl) contactLinks += ' <a class="contact-link" href="' + esc(CONFIG.helpdeskUrl) + '" target="_blank" rel="noreferrer noopener">📝 Helpdesk</a>';

  body.innerHTML = resumeHtml +
    '<p class="solution-title">Solution pas-à-pas</p>' +
    '<ol class="solution-steps">' + stepsHtml + '</ol>' +
    '<div class="contact-bar"><span class="contact-label">🆘 Besoin d\'aide ?</span>' + contactLinks + '</div>' +
    '<p class="faq-footer">Mis à jour : ' + esc(item.field_7 || '') + '</p>';

  article.appendChild(body);
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function parseSolution(sol) {
  var s = String(sol || '');
  var byPipe = s.split('|').map(function(t) { return t.replace(/^\d+[)\.]\s*/, '').trim(); }).filter(Boolean);
  if (byPipe.length > 1) return byPipe;
  var parts = s.split(/(?=\d+[)\.]\s)/).map(function(t) { return t.replace(/^\d+[)\.]\s*/, '').trim(); }).filter(Boolean);
  if (parts.length > 1) return parts;
  return s.split(/[\r\n]+/).map(function(t) { return t.replace(/^\d+[)\.]\s*/, '').trim(); }).filter(Boolean);
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

function buildTabs() {
  catNav.innerHTML = '<button class="cat-tab active" data-key="">Toutes les catégories</button>';
  CATEGORIES.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'cat-tab';
    btn.dataset.key = cat.key;
    btn.textContent = cat.icon + ' ' + cat.label;
    btn.addEventListener('click', function() { showCategory(cat.key); });
    catNav.appendChild(btn);
  });
  catNav.querySelector('[data-key=""]').addEventListener('click', showHome);
}

function setActiveTab(key) {
  catNav.querySelectorAll('.cat-tab').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.key === key);
  });
}

// ── Événements ────────────────────────────────────────────────────────────────
searchInput.addEventListener('input', function() {
  var q = searchInput.value.trim();
  clearBtn.classList.toggle('hidden', !q);
  handleSearch(q);
});

clearBtn.addEventListener('click', function() {
  searchInput.value = '';
  hide(clearBtn);
  showHome();
  searchInput.focus();
});

backBtn.addEventListener('click', showHome);

retryBtn.addEventListener('click', loadItems);

// ── Démarrage ─────────────────────────────────────────────────────────────────
loadItems();
</script>
